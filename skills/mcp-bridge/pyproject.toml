[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-mcp-bridge"
version = "0.1.0"
description = "Generic MCP server for communicating with Openclaw agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Openclaw MCP Bridge Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Omni-NexusAI/openclaw-mcp-bridge"
Documentation = "https://github.com/Omni-NexusAI/openclaw-mcp-bridge#readme"
Repository = "https://github.com/Omni-NexusAI/openclaw-mcp-bridge"
Issues = "https://github.com/Omni-NexusAI/openclaw-mcp-bridge/issues"

[project.scripts]
openclaw-mcp = "openclaw_mcp_bridge.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
